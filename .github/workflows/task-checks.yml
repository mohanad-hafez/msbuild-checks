name: Task checks
on:
  push:
    branches: [checks-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check behavior
        run: node .checks/run_checks.cjs .checks/cases.json .checks/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks
          path: .checks/results.json
          retention-days: 7

      - name: Validate build
        run: ./build.sh -v quiet
      - name: Validate bootstrap and sample
        run: |
          source artifacts/msbuild-build-env.sh
          dotnet --version
          dotnet build src/Samples/Dependency/Dependency.csproj
          dotnet artifacts/bin/bootstrap/core/MSBuild.dll --help
